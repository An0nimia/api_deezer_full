[project]
name = 'api-deezer-full'
version = '0.0.1b42'
description = "Wrapper for all 'hidden' deezer APIs"
license = 'CC BY 4.0'
readme = 'README.md'
repository = "https://github.com/An0nimia/api_deezer_full"
requires-python = ">=3.12,<4.0"
authors = [
	{ name = "An0nimia", email = "an0nimia@protonmail.com" },
]
dependencies = [
	"requests (>=2.32.4,<3.0.0)",
	"pydantic (>=2.11.7,<3.0.0)",
	"pyjwt (>=2.10.1,<3.0.0)",
	"pycryptodomex (>=3.23.0,<4.0.0)",

]

[build-system]
requires = ['poetry-core']
build-backend = 'poetry.core.masonry.api'
